<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
    <link rel="stylesheet"  href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Ubicación</h1>

        <label for="nombre de la ubicacion">nombre de la ubicación</label>
        <input type="text" id="nombre de la ubicacion" name="nombre de la ubicacion" >
        
        <label for="latitud">Latitud</label>
        <input type="number" id="latitud" name="latitud" step="0.0001">

        <label for="longitud">Longitud</label>
        <input type="number" id="longitud" name="longitud" step="0.0001">

        <button onclick="abrirubicacion()">Abrir ubicación</button> 
    </div>

    <script src="script.js"></script>
</body>
</html>
