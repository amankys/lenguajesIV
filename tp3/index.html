
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar imagen</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="contenedor">

        <div class="seleccion">
            <p>Seleccionar imagen</p>

            <input type="file" id="imagenInput" accept="image/*">

            <button id="btnSubir">Subir archivo</button>
        </div>

        <div class="resultado">

            <p id="nombre"></p>
            <p id="tamano"></p>
            <p id="tipo"></p>

            <img id="imagen" src="" alt="Imagen seleccionada">

        </div>

    </div>

<script src="script.js"></script>
    

</body>
</html>
</body>
</html>
